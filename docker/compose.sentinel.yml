# One primary, two replicas, three Sentinels, and a Python client that keeps
# writing while you kill the primary.
#
#   docker compose -f compose.sentinel.yml up -d
#   docker compose -f compose.sentinel.yml logs -f demo        # watch the client
#   docker compose -f compose.sentinel.yml kill redis-primary  # pull the plug
#   docker compose -f compose.sentinel.yml exec sentinel-1 \
#       redis-cli -p 26379 SENTINEL get-master-addr-by-name slicedice
#
# Everything talks over the Docker network, so the client runs in a container
# too (Sentinel hands out container addresses your laptop can't reach).
#
# NOT RUN BY THE BOOK'S TEST SUITE. The same setup without Docker is
# tests/part7_sentinel.sh, which is tested.
x-sentinel: &sentinel
  image: redis:8
  depends_on: [redis-primary, redis-replica-1, redis-replica-2]
  command:
    - sh
    - -c
    - |
      cat > /tmp/sentinel.conf <<EOF
      port 26379
      sentinel resolve-hostnames yes
      sentinel monitor slicedice redis-primary 6379 2
      sentinel down-after-milliseconds slicedice 5000
      sentinel failover-timeout slicedice 30000
      sentinel parallel-syncs slicedice 1
      EOF
      exec redis-sentinel /tmp/sentinel.conf

services:
  redis-primary:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes"]

  redis-replica-1:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes", "--replicaof", "redis-primary", "6379"]
    depends_on: [redis-primary]

  redis-replica-2:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes", "--replicaof", "redis-primary", "6379"]
    depends_on: [redis-primary]

  sentinel-1: *sentinel
  sentinel-2: *sentinel
  sentinel-3: *sentinel

  demo:
    image: python:3.12-slim
    depends_on: [sentinel-1, sentinel-2, sentinel-3]
    volumes:
      - ../python:/app:ro
    environment:
      SENTINELS: "sentinel-1:26379,sentinel-2:26379,sentinel-3:26379"
      RUN_SECONDS: "300"
    command: ["sh", "-c", "pip install -q redis==8.1.0 && sleep 5 && python -u /app/part7_sentinel_client.py"]
